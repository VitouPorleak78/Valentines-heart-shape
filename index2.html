<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Oeng Naly ❤️</title>
    <style>
        body {
            background-color: #ffe6e6; 
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden; 
        }

        h1 {
            color: #ff4d4d;
            font-size: 2.5rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
            z-index: 10;
        }

        .photo-container {
            width: 200px;
            height: 200px;
            border: 8px solid white;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            z-index: 10;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            background-color: #ff4d4d;
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
            transition: transform 0.2s;
            cursor: pointer;
            z-index: 10;
        }

        .btn:hover {
            transform: scale(1.1);
            background-color: #e60000;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>Happy Valentine's Day! 🌹</h1>
    
    <div class="photo-container">
        <img src="photo.jpg" alt="Oeng Naly">
    </div>

    <a href="surprise2.html" class="btn">Click for Surprise 🎁</a>

</body>
</html>
